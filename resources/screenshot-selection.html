<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: rgba(4, 8, 18, 0.28); cursor: crosshair; user-select: none; }
      #hint { position: fixed; left: 50%; top: 26px; transform: translateX(-50%); padding: 9px 16px; border-radius: 999px; background: rgba(10, 14, 26, 0.82); border: 1px solid rgba(255,255,255,.22); color: #fff; font: 12px/1.4 "Segoe UI", sans-serif; letter-spacing: .02em; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
      #sel { position: fixed; display: none; border: 1.5px solid #8fa8ff; background: rgba(120, 150, 255, .10); box-shadow: 0 0 0 9999px rgba(4, 8, 18, .28); }
      #size { position: fixed; display: none; padding: 3px 6px; border-radius: 5px; background: rgba(10, 14, 26, .85); color: #dce4ff; font: 10px/1.2 "Segoe UI", sans-serif; }
    </style>
  </head>
  <body>
    <div id="hint">拖动选择截图区域 · Esc 取消</div>
    <div id="sel"></div>
    <div id="size"></div>
    <script>
      const { ipcRenderer } = require('electron')
      const sel = document.getElementById('sel')
      const size = document.getElementById('size')
      let start = null
      const send = (x, y, w, h) => ipcRenderer.send('island:screenshot-selected', { x, y, w, h })
      window.addEventListener('mousedown', (event) => {
        if (event.button !== 0) return
        start = { x: event.clientX, y: event.clientY }
        sel.style.display = 'block'
        sel.style.left = start.x + 'px'
        sel.style.top = start.y + 'px'
        sel.style.width = '0px'
        sel.style.height = '0px'
      })
      window.addEventListener('mousemove', (event) => {
        if (!start) return
        const x = Math.min(start.x, event.clientX)
        const y = Math.min(start.y, event.clientY)
        const w = Math.abs(event.clientX - start.x)
        const h = Math.abs(event.clientY - start.y)
        sel.style.left = x + 'px'
        sel.style.top = y + 'px'
        sel.style.width = w + 'px'
        sel.style.height = h + 'px'
        size.style.display = 'block'
        size.textContent = Math.round(w) + ' × ' + Math.round(h)
        size.style.left = Math.min(window.innerWidth - 80, event.clientX + 14) + 'px'
        size.style.top = Math.min(window.innerHeight - 24, event.clientY + 14) + 'px'
      })
      window.addEventListener('mouseup', (event) => {
        if (!start) return
        const x = Math.min(start.x, event.clientX)
        const y = Math.min(start.y, event.clientY)
        const w = Math.abs(event.clientX - start.x)
        const h = Math.abs(event.clientY - start.y)
        start = null
        if (w < 8 || h < 8) {
          ipcRenderer.send('island:screenshot-cancel')
          return
        }
        send(x, y, w, h)
      })
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') ipcRenderer.send('island:screenshot-cancel')
      })
      window.focus()
    </script>
  </body>
</html>
